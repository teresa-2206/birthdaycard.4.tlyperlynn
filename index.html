<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18th Birthday for Cát Tiên elele</title>

  <style>
    :root {
      --pink: #e6a82e;
      --pink-dark: #9c6214;
      --cream: #fffdf5;
      --purple: #c99a38;
      --ink: #4a3d24;
      --gold: #f2be4c;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background: #fffdf4;
    }

    button {
      font: inherit;
    }

    /* Nút bật/tắt nhạc nền tự lặp lại cố định ở góc màn hình */
    .floating-music-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 950;
      padding: 12px 18px;
      border: 2px solid #ffffff;
      border-radius: 999px;
      background: var(--pink-dark);
      color: #ffffff;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      box-shadow: 0 10px 26px rgba(156, 98, 20, 0.32);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .floating-music-btn:hover {
      transform: translateY(-2px);
    }

    .floating-music-btn.playing {
      background: #7e9d87;
    }

    .opening {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.92) 0 8%, transparent 9%),
        radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.75) 0 7%, transparent 8%),
        linear-gradient(135deg, #fff3b8, #ffe699 55%, #fff9db);
    }

    .opening-card {
      position: relative;
      z-index: 2;
      width: min(540px, 100%);
    }

    /* 4 ảnh ở 4 góc màn hình đầu tiên */
    .corner-photos {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .corner-photo {
      position: absolute;
      margin: 0;
      width: clamp(165px, 21vw, 280px);
      padding: 8px 8px 18px;
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 16px 34px rgba(110, 88, 42, 0.18);
      opacity: 0;
      pointer-events: auto;
      transition: transform 250ms ease, box-shadow 250ms ease;
    }

    .corner-photo img {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: block;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 3px;
    }

    .corner-tl {
      top: 5%;
      left: 4%;
      --tilt: -8deg;
      --start-x: -40px;
      --start-y: -40px;
    }

    .corner-tr {
      top: 5%;
      right: 4%;
      --tilt: 7deg;
      --start-x: 40px;
      --start-y: -40px;
    }

    .corner-bl {
      bottom: 6%;
      left: 5%;
      --tilt: 6deg;
      --start-x: -40px;
      --start-y: 40px;
    }

    .corner-br {
      bottom: 6%;
      right: 5%;
      --tilt: -7deg;
      --start-x: 40px;
      --start-y: 40px;
    }

    .corner-photos.show .corner-photo {
      animation: cornerPop 750ms cubic-bezier(.2, .85, .3, 1.15) forwards;
    }

    .corner-photos.show .corner-tl { animation-delay: 0ms; }
    .corner-photos.show .corner-tr { animation-delay: 100ms; }
    .corner-photos.show .corner-bl { animation-delay: 200ms; }
    .corner-photos.show .corner-br { animation-delay: 300ms; }

    .corner-photos.show .corner-photo:hover {
      transform: scale(1.06) rotate(0deg);
      box-shadow: 0 22px 40px rgba(110, 88, 42, 0.25);
      z-index: 3;
    }

    @keyframes cornerPop {
      0% {
        opacity: 0;
        transform: translate(var(--start-x), var(--start-y)) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(var(--tilt));
      }
    }

    .opening h1 {
      margin: 0;
      color: white;
      font-size: clamp(3rem, 11vw, 6rem);
      line-height: 0.95;
      text-shadow: 0 5px 22px rgba(156, 98, 20, 0.28);
    }

    .revealed-title {
      display: none;
    }

    .revealed-title.show {
      display: block;
      animation: titleReveal 1s cubic-bezier(.2,.7,.2,1) both;
    }

    .opening-subtitle {
      margin: 18px 0 26px;
      color: #785b2c;
      font-family: system-ui, sans-serif;
      font-size: clamp(1rem, 4vw, 1.25rem);
    }

    .open-button {
      min-width: 210px;
      padding: 15px 28px;
      color: white;
      font-family: system-ui, sans-serif;
      font-weight: 800;
      background: var(--pink-dark);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(156, 98, 20, 0.25);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .open-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(156, 98, 20, 0.32);
    }

    .open-button:focus-visible,
    .envelope-box:focus-visible,
    .mini-letter:focus-visible,
    .cake:focus-visible,
    .floating-music-btn:focus-visible {
      outline: 4px solid var(--ink);
      outline-offset: 5px;
    }

    .open-button.opened {
      background: #7e9d87;
    }

    .scroll-note {
      display: none;
      margin-top: 26px;
      color: #785b2c;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      animation: floatDown 1.5s ease-in-out infinite;
    }

    .scroll-note.show {
      display: block;
    }

    section {
      padding: 90px 24px;
    }

    .section-inner {
      width: min(1000px, 100%);
      margin: auto;
    }

    .section-heading {
      margin: 0 0 14px;
      color: var(--pink-dark);
      text-align: center;
      font-size: clamp(2.2rem, 7vw, 4.2rem);
    }

    .section-description {
      max-width: 560px;
      margin: 0 auto 42px;
      text-align: center;
      line-height: 1.7;
    }

    /* =======================================================
       PHẦN 8 ẢNH KỶ NIỆM: HIỂN THỊ SẴN 4 ẢNH 1 TRANG POLAROID
       ======================================================= */
    .memories {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 224, 130, 0.45) 0 12px, transparent 13px),
        radial-gradient(circle at 88% 15%, rgba(242, 190, 76, 0.35) 0 16px, transparent 17px),
        radial-gradient(circle at 8% 50%, rgba(242, 190, 76, 0.3) 0 14px, transparent 15px),
        radial-gradient(circle at 92% 55%, rgba(255, 224, 130, 0.5) 0 10px, transparent 11px),
        radial-gradient(circle at 14% 85%, rgba(255, 224, 130, 0.45) 0 12px, transparent 13px),
        radial-gradient(circle at 86% 88%, rgba(242, 190, 76, 0.35) 0 15px, transparent 16px),
        linear-gradient(rgba(255, 253, 244, 0.94), rgba(255, 253, 244, 0.94)),
        radial-gradient(circle at center, #ffe58f, transparent 70%);
    }

    .memory-page {
      max-width: 840px;
      min-height: 85vh;
      margin: 0 auto 64px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      align-items: center;
      justify-items: center;
      padding: 36px 16px;
    }

    .memory-page:last-child {
      margin-bottom: 0;
    }

    .photo {
      position: relative;
      margin: 0;
      padding: 12px 12px 36px;
      background: #ffffff;
      border: 1px solid #f0e4c3;
      border-radius: 4px;
      box-shadow: 0 18px 36px rgba(110, 88, 42, 0.16);
      overflow: visible;
      transform: translate(var(--tx, 0px), var(--ty, 0px)) rotate(var(--tilt, 0deg));
      transition: transform 280ms cubic-bezier(.2, .8, .2, 1), box-shadow 280ms ease;
    }

    .memory-page:nth-of-type(1) .photo:nth-child(1) {
      width: min(325px, 92%);
      aspect-ratio: 4 / 4.6;
      --tilt: -5deg;
      --tx: 18px;
      --ty: 12px;
      z-index: 2;
    }

    .memory-page:nth-of-type(1) .photo:nth-child(2) {
      width: min(295px, 88%);
      aspect-ratio: 4 / 4.3;
      --tilt: 6deg;
      --tx: -20px;
      --ty: -14px;
      z-index: 1;
    }

    .memory-page:nth-of-type(1) .photo:nth-child(3) {
      width: min(290px, 88%);
      aspect-ratio: 4 / 4.4;
      --tilt: 4deg;
      --tx: 22px;
      --ty: -18px;
      z-index: 1;
    }

    .memory-page:nth-of-type(1) .photo:nth-child(4) {
      width: min(335px, 94%);
      aspect-ratio: 4 / 4.7;
      --tilt: -4deg;
      --tx: -16px;
      --ty: 10px;
      z-index: 3;
    }

    .memory-page:nth-of-type(2) .photo:nth-child(1) {
      width: min(295px, 88%);
      aspect-ratio: 4 / 4.3;
      --tilt: 5deg;
      --tx: 20px;
      --ty: 14px;
      z-index: 1;
    }

    .memory-page:nth-of-type(2) .photo:nth-child(2) {
      width: min(330px, 93%);
      aspect-ratio: 4 / 4.7;
      --tilt: -6deg;
      --tx: -18px;
      --ty: -10px;
      z-index: 3;
    }

    .memory-page:nth-of-type(2) .photo:nth-child(3) {
      width: min(325px, 92%);
      aspect-ratio: 4 / 4.6;
      --tilt: -4deg;
      --tx: 16px;
      --ty: -16px;
      z-index: 2;
    }

    .memory-page:nth-of-type(2) .photo:nth-child(4) {
      width: min(295px, 88%);
      aspect-ratio: 4 / 4.4;
      --tilt: 6deg;
      --tx: -20px;
      --ty: 12px;
      z-index: 1;
    }

    .photo:hover {
      transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.05) rotate(0deg);
      box-shadow: 0 24px 46px rgba(110, 88, 42, 0.25);
      z-index: 10 !important;
    }

    .photo::before {
      content: "";
      position: absolute;
      top: -13px;
      left: 50%;
      width: 84px;
      height: 24px;
      background: rgba(242, 190, 76, 0.55);
      border-left: 2px dashed rgba(255, 255, 255, 0.7);
      border-right: 2px dashed rgba(255, 255, 255, 0.7);
      transform: translateX(-50%) rotate(-3deg);
      z-index: 5;
      pointer-events: none;
    }

    .photo:nth-child(even)::before {
      background: rgba(255, 196, 168, 0.55);
      transform: translateX(-50%) rotate(4deg);
    }

    .photo-deco {
      position: absolute;
      pointer-events: none;
      font-size: 1.15rem;
      z-index: 6;
      filter: drop-shadow(0 2px 4px rgba(156, 98, 20, 0.18));
      animation: twinkle 2.4s ease-in-out infinite alternate;
    }

    .deco-tl { top: -14px; left: -12px; transform: rotate(-15deg); }
    .deco-tr { top: -12px; right: -14px; transform: rotate(18deg); animation-delay: 0.6s; }
    .deco-bl { bottom: -12px; left: -14px; transform: rotate(12deg); animation-delay: 1.1s; }
    .deco-br { bottom: -14px; right: -12px; transform: rotate(-18deg); animation-delay: 1.6s; }

    @keyframes twinkle {
      from { transform: scale(0.92) rotate(-8deg); }
      to { transform: scale(1.12) rotate(8deg); }
    }

    .photo-frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 2px;
      background: #fdf6df;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* =======================================================
       PHẦN BÁNH KEM (NẰM NGAY SAU ẢNH KỶ NIỆM)
       ======================================================= */
    .cake-section {
      min-height: 660px;
      background: linear-gradient(180deg, #fff3c4, #fffdf2);
    }

    .cake-wrap {
      display: grid;
      justify-items: center;
    }

    .cake {
      position: relative;
      width: min(430px, 82vw);
      height: 270px;
      margin-top: 40px;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .cake-stand {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 112%;
      height: 24px;
      background: #c7ab6b;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .cake-base {
      position: absolute;
      left: 50%;
      bottom: 15px;
      width: 88%;
      height: 150px;
      background:
        radial-gradient(circle at 12% 20%, #fff 0 8px, transparent 9px),
        radial-gradient(circle at 32% 20%, #fff 0 8px, transparent 9px),
        radial-gradient(circle at 52% 20%, #fff 0 8px, transparent 9px),
        radial-gradient(circle at 72% 20%, #fff 0 8px, transparent 9px),
        radial-gradient(circle at 92% 20%, #fff 0 8px, transparent 9px),
        linear-gradient(#ffe082 0 25%, #ffd257 26% 100%);
      border-radius: 18px 18px 12px 12px;
      box-shadow: inset 0 -18px rgba(166, 118, 24, 0.14);
      transform: translateX(-50%);
    }

    .candles {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 150px;
      width: 78%;
      display: flex;
      justify-content: space-around;
      transform: translateX(-50%);
    }

    .candle {
      position: relative;
      width: 18px;
      height: 72px;
      background: repeating-linear-gradient(
        135deg,
        #fff 0 8px,
        #f2b84b 8px 16px
      );
      border-radius: 5px 5px 2px 2px;
    }

    .flame {
      position: absolute;
      left: 50%;
      bottom: 76px;
      width: 23px;
      height: 34px;
      background: radial-gradient(ellipse at bottom, #fffbe0 0 20%, #ffbe2e 21% 55%, #ff8243 56%);
      border-radius: 50% 50% 48% 48%;
      transform: translateX(-50%);
      transform-origin: bottom;
      animation: flicker 220ms ease-in-out infinite alternate;
      box-shadow: 0 0 18px #ffca57;
    }

    .cake.blown .flame {
      display: none;
    }

    .cake.blown .candle::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 78px;
      width: 18px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(120, 120, 120, 0.38), transparent 70%);
      border-radius: 50%;
      transform: translateX(-50%);
      animation: smoke 2s ease-out forwards;
    }

    .cake-message {
      min-height: 48px;
      margin-top: 25px;
      color: var(--pink-dark);
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
    }

    /* =======================================================
       PHẦN PHONG BÌ THƯ (NẰM DƯỚI SAU PHẦN BÁNH KEM)
       ======================================================= */
    .collage-section {
      background: linear-gradient(135deg, #fff9db, #fff0b8);
    }

    .envelope-stage {
      position: relative;
      width: min(580px, 92vw);
      height: 360px;
      margin: 120px auto 30px;
    }

    .envelope-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #f5df9c;
      border: 0;
      border-radius: 10px;
      box-shadow: 0 22px 45px rgba(110, 88, 42, 0.16);
      cursor: pointer;
      perspective: 1000px;
      z-index: 1;
    }

    .envelope-pocket {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(245, 223, 156, 0.2) 0 42%, #f2d685 43% 100%);
      border-radius: 10px;
      z-index: 3;
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute;
      z-index: 4;
      inset: 0;
      background: #e8cb78;
      clip-path: polygon(0 0, 100% 0, 50% 58%);
      transform-origin: top;
      transition: transform 700ms ease, z-index 0s 350ms;
      pointer-events: none;
    }

    .envelope-stage.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .wax-seal {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 26px;
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.7rem;
      background: var(--pink-dark);
      border: 5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      transform: translateX(-50%);
      transition: opacity 300ms ease, transform 500ms ease;
      pointer-events: none;
    }

    .envelope-stage.open .wax-seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.5);
    }

    .two-letters {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .envelope-stage.open .two-letters {
      z-index: 6;
    }

    .mini-letter {
      position: absolute;
      bottom: 24px;
      width: 47%;
      height: 250px;
      padding: 20px 18px;
      background:
        linear-gradient(rgba(255,255,255,0.95), rgba(255,255,255,0.95)),
        repeating-linear-gradient(0deg, transparent 0 23px, #efe2be 24px);
      border: 2px solid #ead8a8;
      border-radius: 6px;
      box-shadow: 0 14px 28px rgba(96, 76, 36, 0.2);
      text-align: left;
      color: var(--ink);
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px) scale(0.85);
      transition: transform 700ms cubic-bezier(.2, .85, .3, 1.15), opacity 400ms ease, box-shadow 220ms ease;
    }

    .mini-letter-left {
      left: 4%;
    }

    .mini-letter-right {
      right: 4%;
    }

    .envelope-stage.open .mini-letter {
      opacity: 1;
      pointer-events: auto;
    }

    .envelope-stage.open .mini-letter-left {
      transform: translateY(-135px) rotate(-7deg);
      transition-delay: 220ms;
    }

    .envelope-stage.open .mini-letter-right {
      transform: translateY(-145px) rotate(7deg);
      transition-delay: 320ms;
    }

    .envelope-stage.open .mini-letter-left:hover {
      transform: translateY(-148px) rotate(-3deg) scale(1.04);
      box-shadow: 0 22px 40px rgba(96, 76, 36, 0.28);
      z-index: 8;
    }

    .envelope-stage.open .mini-letter-right:hover {
      transform: translateY(-158px) rotate(3deg) scale(1.04);
      box-shadow: 0 22px 40px rgba(96, 76, 36, 0.28);
      z-index: 8;
    }

    .mini-letter-tag {
      display: inline-block;
      padding: 3px 10px;
      margin-bottom: 10px;
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      color: #fff;
      background: var(--pink-dark);
      border-radius: 999px;
    }

    .mini-letter h4 {
      margin: 0 0 8px;
      color: var(--pink-dark);
      font-size: 1.15rem;
    }

    .mini-letter p {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.55;
      color: #6b5630;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-letter-cta {
      position: absolute;
      bottom: 14px;
      right: 14px;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--pink-dark);
    }

    .envelope-label {
      margin-top: 18px;
      color: #826b3e;
      font-family: system-ui, sans-serif;
      text-align: center;
      font-weight: 600;
    }

    /* Khung đọc chi tiết từng bức thư khi bấm vào */
    .letter-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(54, 42, 20, 0.55);
      backdrop-filter: blur(4px);
    }

    .letter-modal.show {
      display: grid;
      animation: fadeIn 250ms ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .letter-paper {
      position: relative;
      width: min(560px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      padding: 44px 36px 36px;
      background:
        linear-gradient(rgba(255,255,255,0.93), rgba(255,255,255,0.93)),
        repeating-linear-gradient(0deg, transparent 0 31px, #efe2be 32px);
      border: 2px solid #ead8a8;
      border-radius: 8px;
      box-shadow: 0 26px 60px rgba(45, 34, 15, 0.35);
      line-height: 1.85;
      animation: paperPop 320ms cubic-bezier(.2, .85, .3, 1.1);
    }

    @keyframes paperPop {
      from { opacity: 0; transform: scale(0.9) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .letter-paper h3 {
      margin: 0 0 16px;
      color: var(--pink-dark);
      font-size: 1.75rem;
    }

    .letter-paper p {
      margin: 0 0 16px;
      font-size: 1.05rem;
    }

    .letter-paper .from {
      margin-top: 24px;
      color: #826b3e;
      font-style: italic;
      font-weight: 700;
    }

    .close-modal-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #f5df9c;
      color: var(--pink-dark);
      font-family: system-ui, sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .close-modal-btn:hover {
      background: var(--pink-dark);
      color: #fff;
    }

    /* =======================================================
       PHẦN CUỐI CÙNG: BĂNG RÔN CHỮ CHẠY + ĐỘI HÌNH USAGI CHÚC MỪNG
       ======================================================= */
    .finale-section {
      padding: 70px 0 100px;
      background:
        radial-gradient(circle at 18% 30%, rgba(255, 224, 130, 0.5) 0 10px, transparent 11px),
        radial-gradient(circle at 82% 25%, rgba(242, 190, 76, 0.4) 0 14px, transparent 15px),
        radial-gradient(circle at 50% 85%, rgba(255, 224, 130, 0.45) 0 12px, transparent 13px),
        linear-gradient(180deg, #fffdf2, #fff5cc);
      overflow: hidden;
    }

    .banner-marquee {
      position: relative;
      width: 100%;
      padding: 18px 0;
      margin-bottom: 54px;
      background: linear-gradient(90deg, #f2be4c, #ffd97d, #f2be4c);
      border-top: 3px dashed #ffffff;
      border-bottom: 3px dashed #ffffff;
      box-shadow: 0 12px 28px rgba(156, 98, 20, 0.16);
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-track {
      display: inline-flex;
      animation: marqueeScroll 18s linear infinite;
    }

    .marquee-track span {
      padding-right: 48px;
      color: #6b4108;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      letter-spacing: 0.5px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
    }

    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .usagi-stage {
      width: min(920px, 92%);
      margin: 0 auto;
      text-align: center;
    }

    .usagi-squad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      align-items: end;
      justify-items: center;
    }

    .usagi-card {
      position: relative;
      width: 100%;
      max-width: 195px;
      aspect-ratio: 1 / 1;
      padding: 12px;
      background: #ffffff;
      border: 4px solid #ffe499;
      border-radius: 24px;
      box-shadow: 0 14px 30px rgba(156, 98, 20, 0.14);
      display: grid;
      place-items: center;
      animation: usagiBounce 1.8s ease-in-out infinite;
    }

    .usagi-card:nth-child(2) { animation-delay: 0.3s; }
    .usagi-card:nth-child(3) { animation-delay: 0.6s; }
    .usagi-card:nth-child(4) { animation-delay: 0.9s; }

    @keyframes usagiBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .usagi-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    .finale-sign {
      margin-top: 36px;
      color: var(--pink-dark);
      font-size: 1.15rem;
      font-style: italic;
    }

    #confettiCanvas {
      position: fixed;
      z-index: 999;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        transform: scale(0.6) rotate(-5deg);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
        filter: blur(0);
      }
    }

    @keyframes floatDown {
      50% { transform: translateY(8px); }
    }

    @keyframes flicker {
      from { transform: translateX(-50%) rotate(-4deg) scaleY(0.95); }
      to { transform: translateX(-50%) rotate(4deg) scaleY(1.08); }
    }

    @keyframes smoke {
      to {
        opacity: 0;
        transform: translate(-50%, -55px) scale(1.8);
      }
    }

    @media (max-width: 700px) {
      section {
        padding: 70px 18px;
      }

      .corner-photo {
        width: 96px;
        padding: 5px 5px 12px;
      }

      .corner-tl { top: 18px; left: 14px; }
      .corner-tr { top: 18px; right: 14px; }
      .corner-bl { bottom: 20px; left: 14px; }
      .corner-br { bottom: 20px; right: 14px; }

      .memory-page {
        min-height: 62vh;
        gap: 12px;
        padding: 20px 4px;
        margin-bottom: 40px;

        padding: 7px 7px 22px;
      }

      .memory-page:nth-of-type(n) .photo:nth-child(1) { width: 96%; --tx: 6px; --ty: 4px; }
      .memory-page:nth-of-type(n) .photo:nth-child(2) { width: 92%; --tx: -6px; --ty: -4px; }
      .memory-page:nth-of-type(n) .photo:nth-child(3) { width: 92%; --tx: 6px; --ty: -6px; }
      .memory-page:nth-of-type(n) .photo:nth-child(4) { width: 97%; --tx: -5px; --ty: 4px; }

      .photo::before {
        width: 56px;
        height: 16px;
        top: -9px;
      }

      .envelope-stage {
        height: 290px;
        margin-top: 110px;
      }

      .mini-letter {
        width: 48%;
        height: 210px;
        padding: 14px 12px;
      }

      .envelope-stage.open .mini-letter-left {
        transform: translateY(-115px) rotate(-6deg);
      }

      .envelope-stage.open .mini-letter-right {
        transform: translateY(-122px) rotate(6deg);
      }

      .usagi-squad {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .cake {
        height: 230px;
      }

      .floating-music-btn {
        right: 14px;
        bottom: 14px;
        padding: 10px 14px;
        font-size: 0.82rem;
      }
    }

      html {
        scroll-behavior: auto;
      }
